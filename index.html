<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#F5F3E9">
<title>BIOBA · Residuos que vuelven a energía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --card:#F3F4EF; --ink:#141414; --muted:#8B8B86; --line:#E9EAE4;
  --lime:#D4E8C2; --lime-soft:#ECF4E3; --green:#2D6A10; --olive:#2D6A10; --olive-d:#2D6A10; --olive-dd:#141414;
  --brown:#B5690C; --brown-d:#5A3A10; --yellow:#EA9B32; --yellow-d:#C97D14; --cream:#FBEAD2;
  --r-lg:26px; --r-md:20px; --r-sm:14px;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#E8EAE2;
  display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(circle at 15% 20%,#DDEFA0 0,transparent 35%),radial-gradient(circle at 85% 80%,#CFE5BE 0,transparent 35%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.sm{width:18px;height:18px} svg.i.xs{width:15px;height:15px}

/* Phone shell */
.phone{width:400px;height:min(860px,96vh);background:var(--bg);border-radius:46px;position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #141414,0 30px 80px rgba(20,20,20,.25);display:flex;flex-direction:column}
@media (max-width:520px){
  body{background:var(--bg)}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;background:#fff;z-index:5}
.brand{display:flex;align-items:center;gap:8px}
.brand .mark{height:40px;width:auto;display:block}
.wordmark{font-family:Poppins,sans-serif;font-weight:800;font-size:21px;letter-spacing:.01em;line-height:1}
.wordmark .b1{color:#2D6A10} .wordmark .b2{color:#EA9B32}
.tagline{font-family:Poppins,sans-serif;font-style:italic;font-size:10px;color:#5F5F59;font-weight:500;margin-top:3px}
.login-hero .brand .mark{height:64px}.login-hero .wordmark{font-size:32px}.login-hero .tagline{font-size:12.5px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.avatar{width:42px;height:42px;border-radius:50%;background:#EA9B32;color:#fff;font-weight:600;font-size:14px;display:grid;place-items:center}

/* Bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 8px 10px;z-index:20}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:#A3A39E;height:100%;justify-content:center;transition:color .2s}
.nav-item.active{color:#2D6A10}
.nav-item.active .dot{opacity:1}
.dot{width:5px;height:5px;border-radius:50%;background:#EA9B32;opacity:0;margin-top:1px}
.fab{width:58px;height:58px;border-radius:50%;background:#2D6A10;color:#fff;display:grid;place-items:center;margin:0 auto;transform:translateY(-6px);box-shadow:0 8px 20px rgba(45,106,16,.3);transition:transform .2s}
.fab:active{transform:translateY(-6px) scale(.94)}
.fab svg.i{width:26px;height:26px;stroke-width:2}

/* Typography & bits */
h1.hello{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px}
.sub{color:var(--muted);font-size:14px;line-height:1.45}
.section-h{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.section-h h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.link{font-size:13px;font-weight:500;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--lime-soft);color:var(--olive-d)}
.chip.ghost{background:transparent;color:var(--muted);font-weight:600;padding-left:0}
.chip.white{background:var(--card);color:var(--ink)}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:999px;font-weight:600;font-size:15px;width:100%;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.dark{background:#2D6A10;color:#fff}
.btn.lime{background:var(--lime);color:var(--olive-dd)}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.yellow{background:var(--yellow);color:var(--brown-d)}
.btn.orange{background:#EA9B32;color:#3B2507}
.btn.canj{border:2.5px solid #EA9B32}
.canj-ic{width:30px;height:30px;border-radius:50%;background:#EA9B32;color:#fff;display:grid;place-items:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.fade-in{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Hero points card */
.hero{position:relative;overflow:hidden;background:var(--lime);border-radius:32px;padding:22px;margin-top:18px;color:var(--olive-dd)}
.hero .label{font-size:13px;font-weight:500;opacity:.7}
.hero .big{font-size:60px;font-weight:600;letter-spacing:-.05em;line-height:1;margin-top:6px}
.hero .big small{font-size:18px;font-weight:700;letter-spacing:0;margin-left:6px}
.hero .note{font-size:13.5px;margin-top:6px;font-weight:500}
.hero .deco{position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.28)}
.hero .hring{position:absolute;right:16px;top:18px;width:104px;height:104px}
.hero .deco2{position:absolute;right:40px;top:60px;width:70px;height:70px;border-radius:50%;background:rgba(234,155,50,.7)}
.hero.oasis{padding:18px 20px 20px;margin:16px -20px 0;background:linear-gradient(180deg,#EEF5E6 0%,#D9EBC9 100%);border-radius:0;overflow:hidden}
.hero.oasis .arc{position:absolute;left:0;top:4px;width:190px;height:270px}
.hero.oasis .ocol{margin-left:160px;text-align:right;position:relative;min-height:240px}
.hero.oasis .label{font-size:12.5px}
.opts{font-size:40px;font-weight:700;letter-spacing:-.04em;color:#2D6A10;line-height:1.05;margin-top:2px}
.opts small{font-size:16px;letter-spacing:0}
.ometa{font-size:17px;font-weight:600;color:#141414;margin-top:2px}
.ostats{background:rgba(255,255,255,.75);border-radius:18px;padding:4px 14px;margin-top:12px}
.ostat{line-height:1.15;padding:8px 0}
.ostat+.ostat{border-top:1px solid rgba(45,106,16,.12)}
.ostat b{display:block;font-size:17px;font-weight:600;color:#141414}
.ostat span{font-size:11px;color:#5F5F59}
.hero.calo{background:#D9EBC9;border-radius:28px;padding:18px 18px 18px 20px}
.calo-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calo-lbl{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:#141414}
.calo-ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;color:#2D6A10}
.calo-big{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:14px;color:#141414}
.calo-big small{font-size:17px;font-weight:600;letter-spacing:0;margin-left:5px;color:#2D6A10}
.calo-sub{font-size:12.5px;color:#4A4A45;margin-top:8px}
.calo-sub b{color:#C97D14}
.pgauge{width:132px;height:132px;flex-shrink:0}
.hero .hero-actions{display:flex;gap:10px;margin-top:18px;position:relative}
.hero.oasis .hero-actions{margin-top:22px}
.hero .btn{height:50px}
.hero .btn.light{background:#fff;border:0}

/* Quick tiles */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.qt{background:var(--card);border-radius:20px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:700;box-shadow:var(--shadow)}
.qt .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--lime-soft);color:var(--olive-d)}
.qt:nth-child(2) .ic{background:var(--cream);color:var(--brown)}
.qt:nth-child(3) .ic{background:#F3EBDD;color:var(--brown)}

/* Aporte card */
.aporte{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);margin-top:16px}
.aporte .ill{width:86px;height:96px;background:var(--lime-soft);border-radius:22px;display:grid;place-items:center;flex-shrink:0}
.aporte .ill svg{width:62px}
.aporte h4{font-size:16px;font-weight:700;line-height:1.2}
.aporte p{font-size:13px;color:var(--muted);margin:4px 0 10px;line-height:1.4}
.pill-btn{display:inline-flex;align-items:center;gap:6px;background:#2D6A10;color:#fff;font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px}
.done-badge{display:inline-flex;align-items:center;gap:6px;background:var(--lime-soft);color:var(--olive-d);font-size:13px;font-weight:700;padding:9px 14px;border-radius:999px}

/* Impact */
.impact{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto auto;gap:10px}
.imp{border-radius:24px;padding:16px;background:var(--card);box-shadow:var(--shadow)}
.imp.main{grid-row:span 2;background:var(--green);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.imp .v{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1}
.imp .v small{font-size:14px;font-weight:700;margin-left:2px}
.imp .t{font-size:12px;line-height:1.35;color:var(--muted);margin-top:6px}
.imp.main .t{color:rgba(255,255,255,.88)}
.imp .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}
.imp .ic.bic,.imp.main .ic.bic{width:46px;height:46px;border-radius:15px;background:#fff}
.bic svg.bi{width:32px;height:32px}
.imp.main .ic{background:rgba(255,255,255,.25);color:#fff}
.ring{width:96px;height:96px;margin:6px 0}

/* Tracking */
.track{background:var(--card);border-radius:var(--r-lg);padding:18px 12px 14px;box-shadow:var(--shadow)}
.steps{display:flex;justify-content:space-between;position:relative;margin:6px 0 14px}
.steps::before{content:"";position:absolute;left:22px;right:22px;top:21px;height:0;border-top:2px dashed #CFD0C9}
.steps .bar{position:absolute;left:22px;top:20px;height:4px;background:#2D6A10;border-radius:4px;transition:width .6s}
.st{display:flex;flex-direction:column;align-items:center;gap:8px;width:54px;position:relative;z-index:1}
.st .c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 1.5px #E3E4DE;color:#A3A39E;position:relative}
.st .bdg{position:absolute;right:-5px;bottom:-5px;width:21px;height:21px;border-radius:50%;background:#EA9B32;color:#3B2507;border:2.5px solid var(--card);display:grid;place-items:center}
.st .bdg svg.i{width:11px;height:11px;stroke-width:3.2}
.st.ok .c{background:#2D6A10;color:#fff}
.st.now .c{background:#fff;color:#2D6A10;box-shadow:inset 0 0 0 2.5px #EA9B32,0 0 0 5px rgba(234,155,50,.18)}
.st span{font-size:9.5px;font-weight:600;text-align:center;line-height:1.15;color:var(--muted)}
.st.now span,.st.ok span{color:var(--ink)}
.track-note{margin:0 4px;background:#fff;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.45;color:var(--ink)}
.track-note b{font-weight:700}

/* List items */
.list{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--lime-soft);color:var(--olive-d);flex-shrink:0}
.li .tt{font-weight:700;font-size:14px}
.li .ss{font-size:12px;color:var(--muted);margin-top:2px}
.li .grow{flex:1;min-width:0}
.pts{font-weight:600;font-size:15px;color:var(--olive-d);background:var(--lime-soft);padding:6px 10px;border-radius:12px}
.pts.kg{color:var(--brown);background:var(--cream)}

/* Segmented & chips row */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:18px;padding:5px;margin-top:18px}
.seg button{height:42px;border-radius:14px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.05)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -20px 4px;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{white-space:nowrap;padding:10px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:500}
.fchip.on{background:var(--green);border-color:var(--green);color:#fff}

/* Saldo card */
.saldo{background:var(--green);color:#fff;border-radius:30px;padding:20px 22px;margin-top:14px;display:flex;justify-content:space-between;align-items:flex-end;position:relative;overflow:hidden}
.saldo .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.85)}
.saldo .v{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1;color:#fff;margin-top:6px}
.saldo .v small{font-size:16px;margin-left:4px}
.saldo .eq{font-size:12px;text-align:right;color:rgba(255,255,255,.85);line-height:1.4;position:relative}
.saldo .deco{position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.15)}

/* Convenios */
.conv{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);margin-top:10px;width:100%;text-align:left}
.logo-b{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.logo-b.img{background:#fff;border:1px solid var(--line);padding:6px;width:64px;overflow:hidden}

.logo-b.img.full{padding:0;border:0;background:#DA291C}
.logo-b.img.full img{max-width:none;max-height:none;width:64px;height:52px;object-fit:cover}
.logo-b.img img{max-width:100%;max-height:38px;width:auto;height:auto;display:block}
.off{text-align:center;background:var(--cream);border-radius:14px;padding:6px 10px;color:var(--brown);line-height:1.05}
.off small{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.off b{font-size:19px;font-weight:700}

/* Scan page */
.scan-hero{background:var(--card);border-radius:32px;padding:18px;box-shadow:var(--shadow);position:relative;margin-top:14px;display:grid;place-items:center;overflow:hidden}
.scan-hero .bg-c{position:absolute;width:230px;height:230px;border-radius:50%;background:var(--lime-soft)}
.scan-hero svg.bin{width:150px;position:relative}
.scan-hero .tag{position:absolute;top:16px;right:16px}
.tips{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.tip{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.tip .n{width:28px;height:28px;border-radius:50%;background:var(--lime-soft);color:var(--olive-d);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two .btn{font-size:13.5px;height:50px}

/* Scanner overlay */
.scanner{position:absolute;inset:0;background:#15130D;z-index:50;display:flex;flex-direction:column;color:#fff;animation:fade .25s ease}
.scanner .sc-top{display:flex;justify-content:space-between;align-items:center;padding:20px}
.scanner .sc-top .icon-btn{background:rgba(255,255,255,.12);box-shadow:none;color:#fff}
.vf{flex:1;position:relative;margin:0 26px;border-radius:30px;overflow:hidden;background:#2A261C;display:grid;place-items:center}
.vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.vf .corner{position:absolute;width:40px;height:40px;border:4px solid var(--lime)}
.vf .c1{top:18px;left:18px;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
.vf .c2{top:18px;right:18px;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
.vf .c3{bottom:18px;left:18px;border-right:0;border-top:0;border-radius:0 0 0 16px}
.vf .c4{bottom:18px;right:18px;border-left:0;border-top:0;border-radius:0 0 16px 0}
.vf .line{position:absolute;left:24px;right:24px;height:3px;background:#EA9B32;box-shadow:0 0 18px 4px rgba(212,234,127,.6);border-radius:3px;animation:sweep 1.6s ease-in-out infinite}
@keyframes sweep{0%{top:12%}50%{top:86%}100%{top:12%}}
.vf .gauge{position:absolute;right:26px;top:16%;bottom:16%;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-weight:700;color:var(--lime);text-align:right}
.vf .gauge span::after{content:"";display:inline-block;width:14px;height:2px;background:var(--lime);margin-left:6px;vertical-align:middle}
.vf .win{width:90px;height:62%;border:3px dashed rgba(212,234,127,.7);border-radius:46px;position:relative}
.sc-status{text-align:center;padding:18px 20px 30px;font-size:14px;color:#D8D3C2}
.sc-status b{display:block;color:#fff;font-size:17px;margin-bottom:4px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:8px;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.2}}

/* Bottom sheet */
.backdrop{position:absolute;inset:0;background:rgba(30,24,12,.45);z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:32px 32px 0 0;padding:12px 20px 28px;z-index:61;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:#D6D0BC;margin:0 auto 16px}
.result-ring{display:grid;place-items:center;margin:6px 0 12px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
.kv div{background:var(--card);border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.kv b{display:block;font-size:20px;font-weight:700}
.kv span{font-size:11px;color:var(--muted);font-weight:600}
input[type=range]{width:100%;accent-color:var(--olive-d);height:28px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:700;letter-spacing:.14em;text-align:center;background:var(--card);border:2px dashed var(--olive);border-radius:20px;padding:16px;margin:12px 0}

/* Toast */
.toast{position:absolute;left:20px;right:20px;top:20px;background:#2D6A10;color:#fff;padding:14px 16px;border-radius:18px;font-size:13.5px;font-weight:600;z-index:80;display:flex;gap:10px;align-items:center;transform:translateY(-220%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:none}
.toast svg{color:#EA9B32}

/* Login */
.login{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:0 22px 30px;scrollbar-width:none}
.login-hero{flex-shrink:0;background:var(--lime);border-radius:0 0 40px 40px;margin:0 -22px;padding:56px 26px 30px;position:relative;overflow:hidden}
.login-hero .circ{position:absolute;border-radius:50%}
.login-hero h2{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.02;color:#141414;margin-top:26px;position:relative}
.login-hero .circ svg{width:100%;display:block}
.login-hero p{color:#3A3A36;font-size:14px;margin-top:8px;position:relative;max-width:240px;line-height:1.45}
.field{margin-top:14px}
.field label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.inp{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;height:54px;border:1.5px solid transparent;color:var(--muted)}
.inp:focus-within{border-color:var(--olive)}
.inp input{flex:1;border:0;outline:0;background:none;font-size:15px;color:var(--ink);min-width:0}
.err{color:#B4442A;font-size:13px;font-weight:600;margin-top:10px;min-height:18px}
.divider{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:24px 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.demo{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;width:100%;text-align:left;margin-bottom:10px}
.demo .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.demo b{display:block;font-size:14.5px}
.demo span{font-size:12px;opacity:.75}

/* Encargado */
.next{background:var(--lime);color:#141414;border-radius:32px;padding:22px;margin-top:18px;position:relative;overflow:hidden}
.next .label{font-size:12px;font-weight:700;opacity:.7}
.next .when{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:8px;line-height:1.1}
.next .cd{display:flex;gap:8px;margin:14px 0}
.next .cd div{background:#fff;border-radius:14px;padding:8px 12px;text-align:center;min-width:62px}
.next .cd b{display:block;font-size:22px;font-weight:600;color:#141414}
.next .cd span{font-size:10.5px;color:var(--muted);font-weight:600}
.next p{font-size:13px;color:#3A3A36;line-height:1.45}
.next .deco{position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.3)}
.progress{height:10px;background:#fff;border-radius:10px;overflow:hidden;margin:12px 0 14px}
.progress div{height:100%;background:var(--green);border-radius:10px;transition:width .4s}
.floors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fl{height:58px;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);gap:2px;border:1.5px solid var(--line);transition:all .2s}
.fl b{font-size:17px;color:var(--ink)}
.fl.on{background:var(--green);border-color:var(--green);color:#fff}
.fl.on b{color:#fff}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.day{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.day .d{font-size:12px;color:var(--muted);font-weight:600}
.day b{display:block;font-size:22px;font-weight:700;margin:2px 0}
.day span{font-size:11.5px;font-weight:700;color:var(--olive-d)}


.st .c svg{width:30px;height:30px}
.st .c svg.mini{width:34px;height:22px}
.st:not(.ok):not(.now) .c svg{filter:grayscale(1);opacity:.45}
.st.ok .c{background:#ECF4E3!important;box-shadow:inset 0 0 0 2px #2D6A10}

/* UID-style additions */
.sep-row{display:flex;gap:10px;margin-top:18px;align-items:center;overflow-x:auto;scrollbar-width:none;margin-right:-20px;padding-right:20px}
.sep-row::-webkit-scrollbar{display:none}
.sep{width:50px;height:50px;border-radius:16px;background:#D4E8C2;color:#2D6A10;display:grid;place-items:center;flex-shrink:0;transition:all .2s}
.sep.on{width:auto;display:flex;gap:8px;padding:0 16px;background:#2D6A10;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 8px 18px rgba(45,106,16,.25)}
.sep-tip{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#2D6A10;margin-top:10px;font-weight:500}
.mission{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(135deg,#3F8A1E 0%,#6FAE47 100%);color:#fff;display:flex;padding:20px 0 20px 20px;min-height:180px}
.mission::before{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.m-txt{position:relative;z-index:1;flex:1}
.m-kick{font-size:12px;font-weight:500;opacity:.85}
.m-title{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.05;text-transform:uppercase;margin-top:6px}
.m-sub{font-size:13px;margin-top:6px;opacity:.95}
.m-dots{display:flex;gap:6px;margin:12px 0}
.m-dots i{width:22px;height:6px;border-radius:6px;background:rgba(255,255,255,.35)}
.m-dots i.on{background:#fff}
.m-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#2D6A10;font-size:13px;font-weight:700;padding:9px 14px;border-radius:999px}
.m-btn.done{background:rgba(255,255,255,.2);color:#fff}
.m-art{position:relative;width:130px;flex-shrink:0;display:grid;place-items:end center}
.m-art svg.bin{width:118px;transform:rotate(-8deg);margin-bottom:-26px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.m-medal{position:absolute;right:16px;top:6px;width:40px;height:40px;border-radius:50%;background:#EA9B32;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.vf .detect{position:absolute;top:22%;right:20%;background:#fff;color:#2D6A10;font-size:12px;font-weight:700;padding:7px 11px;border-radius:12px;display:flex;align-items:center;gap:5px;opacity:0;transform:translateY(6px) scale(.9);transition:all .3s}
.vf .detect::after{content:"";position:absolute;left:18px;bottom:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.vf .detect.show{opacity:1;transform:none}
/* Calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head b{font-size:15px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;text-align:center}
.cal .dw{font-size:10.5px;font-weight:500;color:var(--muted);text-transform:uppercase;padding-bottom:6px}
.cal .dn{height:36px;width:36px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:500;color:var(--ink)}
.cal .dn.past{color:#C2C2BC}
.cal .dn.pick{background:var(--green);color:#fff;font-weight:600}
.cal .dn.pick.past{background:#C6DDB5;color:#fff}
.cal .dn.today{box-shadow:inset 0 0 0 2px #EA9B32;color:#C97D14;font-weight:700}
.cal-legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:12px}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* Aprendé */
.atabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.atab{background:var(--card);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;box-shadow:var(--shadow);color:var(--ink)}
.atab.on{background:#2D6A10;color:#fff}
.video{background:var(--card);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);margin-top:14px}
.video .th{height:186px;position:relative;overflow:hidden}
.video .play{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#2D6A10;position:absolute;right:14px;bottom:14px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.video .bd{padding:16px}
.video h4{font-size:16px;font-weight:700;margin:8px 0 4px}
.video p{font-size:13px;color:var(--muted);line-height:1.45}
.yt{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--olive-d);margin-top:10px}
.va{border-radius:var(--r-lg);padding:18px;margin-top:14px}
.va h4{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:12px}
.va ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.va li{background:#fff;border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:600}
.va.si{background:var(--lime-soft)} .va.si h4{color:var(--olive-d)}
.va.no{background:#F6E5DA} .va.no h4{color:#9A3D1E}
.flow{position:relative;margin-top:6px}
.fstep{display:flex;gap:14px;position:relative;padding-bottom:14px}
.fstep::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line)}
.fstep:last-child::before{display:none}
.fstep .n{width:36px;height:36px;border-radius:50%;background:var(--lime);color:#141414;font-weight:600;display:grid;place-items:center;flex-shrink:0;font-size:14px}
.fstep.enc .n{background:var(--cream);color:var(--brown)}
.fstep p{font-size:13.5px;line-height:1.45;padding-top:7px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.stat b{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--olive-d)}
.stat p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.uses{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.use{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.use .ic{width:34px;height:34px;border-radius:11px;background:var(--cream);color:var(--brown);display:grid;place-items:center}
.gl{background:var(--card);border-radius:20px;margin-top:10px;box-shadow:var(--shadow);overflow:hidden}
.gl button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px;font-weight:600;font-size:14.5px;text-align:left}
.gl button svg{transition:transform .2s;color:var(--muted)}
.gl.open button svg{transform:rotate(90deg)}
.gl .def{display:none;padding:0 16px 16px;font-size:13.5px;color:var(--muted);line-height:1.5}
.gl.open .def{display:block}
.letter{font-size:13px;font-weight:700;color:var(--olive);margin:18px 0 0 4px}

/* Profile */
.prof{background:var(--card);border-radius:32px;overflow:hidden;box-shadow:var(--shadow);margin-top:10px}
.prof .cover{height:90px;background:var(--lime);position:relative;overflow:hidden}
.prof .cover::after{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.35)}
.prof .av{width:84px;height:84px;border-radius:50%;background:#2D6A10;color:#fff;font-size:28px;font-weight:700;display:grid;place-items:center;margin:-42px 0 0 20px;position:relative;border:5px solid var(--card)}
.prof .bd{padding:12px 20px 20px}
.prof h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
.prof .meta{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.prof .meta div{display:flex;gap:8px;align-items:center}
.prof .ministats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.prof .ministats div{background:#fff;border-radius:18px;padding:14px}
.prof .ministats b{font-size:22px;font-weight:700;color:var(--olive-d)}
.prof .ministats div:last-child b{color:var(--brown)}
.prof .ministats span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:26px 16px;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.demo-card{padding:6px}
.drow{display:flex;align-items:center;gap:14px;width:100%;padding:16px 14px;font-size:14.5px;font-weight:500;color:var(--muted);text-align:left;border-radius:18px}
.drow:active{background:#fff}
.btn.logout{margin-top:14px;background:#fff;border:1.5px solid var(--line);color:#2D6A10;font-weight:700;font-size:16px}

/* Soporte */
.sup-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sup{background:var(--card);border-radius:24px;padding:16px;text-align:left;box-shadow:var(--shadow);border:2px solid transparent;transition:border .2s}
.sup.on{border-color:#2D6A10}
.sup .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px}
.sup b{font-size:14px;display:block;line-height:1.25}
.sup span{font-size:12px;color:var(--muted);line-height:1.35;display:block;margin-top:4px}
textarea.ta{width:100%;min-height:96px;border:1.5px solid transparent;border-radius:18px;padding:14px;background:var(--card);box-shadow:var(--shadow);resize:none;outline:0;font-size:14px}
textarea.ta:focus{border-color:var(--olive)}
.urg{display:flex;gap:8px;margin-top:10px}
.urg button{flex:1;height:44px;border-radius:999px;background:var(--card);font-weight:600;font-size:13px}
.urg button.on{background:var(--yellow);color:var(--brown-d)}
.status{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--cream);color:var(--brown)}
.status.used{background:#ECECE8;color:var(--muted)}
.logo-b.sm{width:50px!important;height:42px;border-radius:12px;padding:4px}
.logo-b.sm img{max-height:32px!important}
.logo-b.img.full.sm img{width:50px;height:42px}
.status.ok{background:var(--lime-soft);color:var(--olive-d)}
</style>
</head>

const fresh=()=>({user:null,tab:'inicio',points:37.5,hist:GEN_HISTORY.slice(),canjes:SAMPLE_CANJES(),seedC:1,scannedToday:false,
  encHist:ENC_HISTORY.slice(),floors:Array(12).fill(false),tickets:[],bcat:'Todos',btab:'conv',atab:'videos'});
let S;
try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=fresh()}
if(!S.seedC){S.canjes=S.canjes.concat(SAMPLE_CANJES());S.seedC=1}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const U=()=>USERS[S.user];
const f1=n=>Number(n).toLocaleString('es-AR',{maximumFractionDigits:1});
const totalKg=()=>S.hist.reduce((a,h)=>a+h.kg,0);
const nowLabel=()=>{const d=new Date();return 'Hoy · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

/* ---------- UI helpers ---------- */
const $=s=>document.querySelector(s);
let toastT;
function toast(msg,icon='check'){const t=$('#toast');t.innerHTML=ic(icon)+`<span>${msg}</span>`;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('show');$('#backdrop').classList.add('show')}
function closeSheet(){$('#sheet').classList.remove('show');$('#backdrop').classList.remove('show')}
$('#backdrop').onclick=closeSheet;
function go(tab){S.tab=tab;save();render();const sc=document.querySelector('.scroll');if(sc)sc.scrollTop=0}

/* ---------- Render ---------- */
let lastTab=null;
function render(){
  const root=$('#root');
  if(!S.user){root.innerHTML=loginView();bindLogin();return}
  const u=U();
  const views=u.role==='gen'
    ?{inicio:genHome,beneficios:beneficios,escanear:scanView,aprende:aprende,perfil:perfil}
    :{inicio:encHome,soporte:soporte,escanear:scanView,aprende:aprende,perfil:perfil};
  if(!views[S.tab])S.tab='inicio';
  const anim=S.tab!==lastTab;lastTab=S.tab;
  root.innerHTML=`
    <div class="topbar">${brand()}</div>
    <div class="scroll"><div class="${anim?'fade-in':''}">${views[S.tab]()}</div></div>
    ${navView(u.role)}`;
  if(u.role==='enc'&&S.tab==='inicio')startCountdown();
}
function navView(role){
  const items=role==='gen'
    ?[['inicio','home','Inicio'],['beneficios','gift','Beneficios'],['escanear'],['aprende','book','Aprendé'],['perfil','user','Perfil']]
    :[['inicio','home','Inicio'],['soporte','headset','Soporte'],['escanear'],['aprende','book','Aprendé'],['perfil','user','Perfil']];
  return `<nav class="nav">${items.map(([k,i,l])=>k==='escanear'
    ?`<button class="fab" onclick="go('escanear')" aria-label="Escanear">${ic('scan')}</button>`
    :`<button class="nav-item ${S.tab===k?'active':''}" onclick="go('${k}')">${ic(i)}<span>${l}</span><i class="dot"></i></button>`).join('')}</nav>`;
}

function bindLogin(){
  $('#eye').onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password'};

    if(!u||pw!=='1234'){$('#err').textContent='Email o contraseña incorrectos.';return}
    login(u.id)};
}
function login(id){S.user=id;S.tab='inicio';save();render();toast(`¡Hola ${USERS[id].first}!`,'leaf')}

const ANCHOR=new Date(2026,10,4,19,0,0).getTime(),EVERY=2*864e5;
function nextPickups(n=4){const now=Date.now();let k=Math.ceil((now-ANCHOR)/EVERY);if(ANCHOR+k*EVERY<=now)k++;return Array.from({length:n},(_,i)=>new Date(ANCHOR+(k+i)*EVERY))}
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const dd=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');

    ${done===12?`<button class="btn dark" style="margin-top:14px" onclick="go('escanear')">${ic('scan','sm')} Escanear contenedor y registrar</button>`:''}
  </div>

  <div class="section-h"><h3>Calendario de recolección</h3></div>
  <div class="card">${calView()}</div>

  <div class="section-h"><h3>Últimas entregas</h3><button class="link" onclick="go('perfil')">Ver todo</button></div>
  <div class="list">${S.encHist.slice(0,4).map(encItem).join('')}</div>`;
}
let calOff=0;
function calView(){
  const base=new Date();const m=new Date(base.getFullYear(),base.getMonth()+calOff,1);
  const days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();const lead=(m.getDay()+6)%7;
  const today=new Date();today.setHours(0,0,0,0);
  const isPick=d=>{const t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),19).getTime();const k=(t-ANCHOR)/EVERY;return Math.abs(k-Math.round(k))<1e-6};
  let cells=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="dw">${x}</div>`).join('')+'<div></div>'.repeat(lead);
  for(let i=1;i<=days;i++){const d=new Date(m.getFullYear(),m.getMonth(),i);const c=['dn'];if(isPick(d))c.push('pick');if(d<today)c.push('past');if(d.getTime()===today.getTime())c.push('today');cells+=`<div class="${c.join(' ')}">${i}</div>`}
  const mn=m.toLocaleDateString('es-AR',{month:'long'});const title=mn[0].toUpperCase()+mn.slice(1)+' '+m.getFullYear();
  return `<div class="cal-head"><button class="icon-btn" style="background:#fff;width:36px;height:36px" onclick="calOff--;keepScroll()" aria-label="Mes anterior">${ic('back','sm')}</button><b>${title}</b><button class="icon-btn" style="background:#fff;width:36px;height:36px" onclick="calOff++;keepScroll()" aria-label="Mes siguiente">${ic('chev','sm')}</button></div>
  <div class="cal">${cells}</div>
  <div class="cal-legend"><span><i style="background:var(--green)"></i>Recolección 19:00</span><span><i style="box-shadow:inset 0 0 0 2px #EA9B32"></i>Hoy</span></div>`;
}
function keepScroll(){const sc=$('.scroll').scrollTop;render();$('.scroll').scrollTop=sc}
function toggleFloor(i){S.floors[i]=!S.floors[i];save();const sc=$('.scroll').scrollTop;render();$('.scroll').scrollTop=sc;if(S.floors.every(Boolean))toast('¡Todos los pisos listos!','check')}
let cdT;
function startCountdown(){clearInterval(cdT);const tick=()=>{const el=$('#cd');if(!el){clearInterval(cdT);return}
  const ms=nextPickups(1)[0]-Date.now(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  el.innerHTML=`<div><b>${d}</b><span>días</span></div><div><b>${h}</b><span>horas</span></div><div><b>${m}</b><span>min</span></div>`};tick();cdT=setInterval(tick,30000)}

  <div class="sup-opts">${opts.map(([k,i,t,d,bg,fg])=>`<button class="sup ${supSel===k?'on':''}" onclick="supSel='${k}';render()"><div class="ic" style="background:${bg};color:${fg}">${ic(i,'sm')}</div><b>${t}</b><span>${d}</span></button>`).join('')}</div>
  <div class="section-h"><h3>Contanos qué pasa</h3></div>
  <textarea class="ta" id="supTxt" placeholder="Ej: la tapa del cesto del piso 4 no cierra bien"></textarea>
  <div class="urg">${[['normal','Normal'],['alta','Urgente']].map(([k,l])=>`<button class="${supUrg===k?'on':''}" onclick="supUrg='${k}';const t=$('#supTxt').value;render();$('#supTxt').value=t">${l}</button>`).join('')}</div>
  <button class="btn dark" style="margin-top:14px" onclick="sendTicket()">${ic('send','sm')} Enviar solicitud</button>
  <div class="section-h"><h3>Mis solicitudes</h3></div>
  ${S.tickets.length?`<div class="list">${S.tickets.map(t=>`<div class="li"><div class="ic" style="background:var(--cream);color:var(--brown)">${ic('headset','sm')}</div><div class="grow"><div class="tt">#${t.id} · ${t.type}</div><div class="ss">${t.date}${t.urg==='alta'?' · Urgente':''}</div></div><span class="status">En revisión</span></div>`).join('')}</div>`
  :`<div class="card"><div class="empty" style="padding:10px"><b>Sin solicitudes</b>Cuando envíes una, vas a ver su estado acá.</div></div>`}`;
}
function sendTicket(){
  const txt=$('#supTxt').value.trim();
  if(!txt){toast('Escribí una breve descripción','alert');return}
  const names={mant:'Mantenimiento',emer:'Recolección de emergencia',bolsas:'Pedido de bolsas',otro:'Consulta'};
  S.tickets.unshift({id:1000+Math.floor(Math.random()*9000),type:names[supSel],urg:supUrg,date:nowLabel(),txt});save();render();
  toast('Solicitud enviada (demo). Te contactamos pronto.','send');
}

render();
</script>
</body>
</html>
